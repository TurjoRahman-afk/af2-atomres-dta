<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 862" width="940" height="862" role="img" aria-label="AF2-AtomRes-DTA forward pass. Drug SMILES and protein sequence are each encoded twice: once by a pretrained language model feeding a transformer, once into a graph network. ProteinGraphNet's per-residue embeddings are reused to produce a residue prior that biases atom-to-residue attention. Four 128-dimensional vectors are concatenated and passed to a KAN predictor that outputs a single predicted pKd.">
  <defs>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#5A6472"/></marker>
    <marker id="ad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#B45309"/></marker>
    <marker id="ap" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#0B57D0"/></marker>
    <marker id="aj" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#0F766E"/></marker>
  </defs>

  <rect x="0" y="0" width="940" height="862" fill="#FFFFFF"/>

  <text x="20" y="18" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#B45309">DRUG</text>
  <text x="920" y="18" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#0B57D0">PROTEIN</text>

  <!-- ROW A - inputs -->
  <rect x="20" y="28" width="150" height="46" rx="5" fill="#FBEEDC" stroke="#B45309" stroke-width="1.2"/>
  <text x="95" y="48" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">SMILES</text>
  <text x="95" y="64" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">ChemBERTa</text>

  <rect x="210" y="28" width="150" height="46" rx="5" fill="#FBEEDC" stroke="#B45309" stroke-width="1.2"/>
  <text x="285" y="48" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">SMILES</text>
  <text x="285" y="64" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">RDKit · 88 atom feats</text>

  <rect x="580" y="28" width="150" height="46" rx="5" fill="#E3ECFB" stroke="#0B57D0" stroke-width="1.2"/>
  <text x="655" y="48" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">AlphaFold2</text>
  <text x="655" y="64" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">Cα &lt; 8 Å contacts</text>

  <rect x="770" y="28" width="150" height="46" rx="5" fill="#E3ECFB" stroke="#0B57D0" stroke-width="1.2"/>
  <text x="845" y="48" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">Sequence</text>
  <text x="845" y="64" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">ESM-C</text>

  <!-- ROW B - encoders -->
  <rect x="20" y="98" width="150" height="46" rx="5" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="95" y="118" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">fc3 · 384→128</text>
  <text x="95" y="134" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">Transformer ×3</text>

  <rect x="210" y="98" width="150" height="46" rx="5" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="285" y="118" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">DrugGraphNet</text>
  <text x="285" y="134" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">GCN + 5×GAT</text>

  <rect x="580" y="98" width="150" height="46" rx="5" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="655" y="118" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">ProteinGraphNet</text>
  <text x="655" y="134" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">GCN + 5×GAT</text>

  <rect x="770" y="98" width="150" height="46" rx="5" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="845" y="118" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">fc2 · 1152→128</text>
  <text x="845" y="134" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">Transformer ×3</text>

  <!-- ROW C - tensors -->
  <rect x="20" y="168" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="95" y="187" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#11151C">Hd [B,220,128]</text>

  <rect x="210" y="168" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="285" y="187" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#11151C">smiles_graph</text>

  <rect x="580" y="168" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="655" y="187" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#11151C">fasta_graph</text>

  <rect x="770" y="168" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="845" y="187" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#11151C">Hp [B,1200,128]</text>

  <!-- ROW D - residue_emb, the reused output -->
  <rect x="620" y="212" width="110" height="30" rx="15" fill="#DCEFEC" stroke="#0F766E" stroke-width="1.6"/>
  <text x="675" y="231" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#11151C">residue_emb</text>
  <text x="675" y="258" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#5A6472">[B,1200,256]</text>

  <!-- ROW E - residue prior -->
  <rect x="395" y="258" width="150" height="44" rx="5" fill="#DCEFEC" stroke="#0F766E" stroke-width="1.6"/>
  <text x="470" y="278" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">Residue prior</text>
  <text x="470" y="294" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">MLP 256→32→1</text>

  <rect x="400" y="318" width="140" height="28" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="470" y="336" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#11151C">residue_logit</text>

  <!-- ROW G - interaction -->
  <rect x="340" y="366" width="260" height="92" rx="6" fill="#DCEFEC" stroke="#0F766E" stroke-width="1.6"/>
  <text x="470" y="390" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="600" fill="#11151C">Structure-guided attention</text>
  <text x="470" y="410" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5A6472">scores = Q(Hd)·K(Hp)ᵀ/√d + β·prior</text>
  <text x="470" y="427" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5A6472">I = softmax(scores)  [B,220,1200]</text>
  <text x="470" y="444" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5A6472">f_int = mean(Hd ⊙ I·Hp)</text>

  <!-- ROW H - f_int -->
  <rect x="400" y="478" width="140" height="28" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="470" y="496" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#11151C">f_int [B,128]</text>

  <!-- ROW I - gated fusion -->
  <rect x="395" y="534" width="150" height="44" rx="5" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="470" y="554" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#11151C">GatedFusion</text>
  <text x="470" y="570" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5A6472">learned blend</text>

  <rect x="405" y="594" width="130" height="28" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="470" y="612" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#11151C">g [B,128]</text>

  <!-- ROW K - concat -->
  <rect x="150" y="644" width="640" height="44" rx="5" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.2"/>
  <text x="470" y="663" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#11151C">concat[ f_int , gd , gp , g ]</text>
  <text x="470" y="680" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#5A6472">[B, 512]</text>

  <!-- ROW L - KAN -->
  <rect x="330" y="712" width="280" height="46" rx="5" fill="#DCEFEC" stroke="#0F766E" stroke-width="1.6"/>
  <text x="470" y="732" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="600" fill="#11151C">KAN [512, 1024, 512, 1]</text>
  <text x="470" y="748" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#5A6472">cubic B-spline per connection · 77% of params</text>

  <!-- ROW M - output -->
  <rect x="360" y="792" width="220" height="40" rx="20" fill="#FFFFFF" stroke="#11151C" stroke-width="1.4"/>
  <text x="470" y="817" text-anchor="middle" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="600" fill="#11151C">predicted pKd</text>

  <!-- connectors: A to B -->
  <line x1="95" y1="74" x2="95" y2="98" stroke="#B45309" stroke-width="1.4" marker-end="url(#ad)"/>
  <line x1="285" y1="74" x2="285" y2="98" stroke="#B45309" stroke-width="1.4" marker-end="url(#ad)"/>
  <line x1="655" y1="74" x2="655" y2="98" stroke="#0B57D0" stroke-width="1.4" marker-end="url(#ap)"/>
  <line x1="845" y1="74" x2="845" y2="98" stroke="#0B57D0" stroke-width="1.4" marker-end="url(#ap)"/>

  <!-- B to C -->
  <line x1="95" y1="144" x2="95" y2="168" stroke="#B45309" stroke-width="1.4" marker-end="url(#ad)"/>
  <line x1="285" y1="144" x2="285" y2="168" stroke="#B45309" stroke-width="1.4" marker-end="url(#ad)"/>
  <line x1="655" y1="144" x2="655" y2="168" stroke="#0B57D0" stroke-width="1.4" marker-end="url(#ap)"/>
  <line x1="845" y1="144" x2="845" y2="168" stroke="#0B57D0" stroke-width="1.4" marker-end="url(#ap)"/>

  <!-- ProteinGraphNet second output -->
  <path d="M730 121 H 760 V 227 H 730" fill="none" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aj)"/>
  <!-- residue_emb to residue prior -->
  <path d="M620 227 H 570 V 280 H 545" fill="none" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aj)"/>
  <text x="562" y="248" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#0F766E">reused</text>

  <!-- prior to logit to interaction -->
  <line x1="470" y1="302" x2="470" y2="318" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aj)"/>
  <line x1="470" y1="346" x2="470" y2="366" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aj)"/>

  <!-- Hd into interaction, and on to gd -->
  <path d="M95 198 V 412 H 340" fill="none" stroke="#B45309" stroke-width="1.4" marker-end="url(#ad)"/>
  <path d="M95 412 V 666 H 150" fill="none" stroke="#B45309" stroke-width="1.4" marker-end="url(#ad)"/>
  <text x="104" y="640" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#B45309">mean-pool → gd</text>

  <!-- Hp into interaction, and on to gp -->
  <path d="M845 198 V 412 H 600" fill="none" stroke="#0B57D0" stroke-width="1.4" marker-end="url(#ap)"/>
  <path d="M845 412 V 666 H 790" fill="none" stroke="#0B57D0" stroke-width="1.4" marker-end="url(#ap)"/>
  <text x="836" y="640" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#0B57D0">mean-pool → gp</text>

  <!-- graph branch into GatedFusion -->
  <path d="M285 198 V 556 H 395" fill="none" stroke="#B45309" stroke-width="1.4" marker-end="url(#ad)"/>
  <path d="M612 198 V 556 H 545" fill="none" stroke="#0B57D0" stroke-width="1.4" marker-end="url(#ap)"/>

  <!-- interaction to f_int to concat -->
  <line x1="470" y1="458" x2="470" y2="478" stroke="#5A6472" stroke-width="1.3" marker-end="url(#ag)"/>
  <path d="M400 492 H 300 V 644" fill="none" stroke="#5A6472" stroke-width="1.3" marker-end="url(#ag)"/>

  <!-- fusion to g to concat -->
  <line x1="470" y1="578" x2="470" y2="594" stroke="#5A6472" stroke-width="1.3" marker-end="url(#ag)"/>
  <line x1="470" y1="622" x2="470" y2="644" stroke="#5A6472" stroke-width="1.3" marker-end="url(#ag)"/>

  <!-- concat to KAN to output -->
  <line x1="470" y1="688" x2="470" y2="712" stroke="#5A6472" stroke-width="1.3" marker-end="url(#ag)"/>
  <line x1="470" y1="758" x2="470" y2="792" stroke="#5A6472" stroke-width="1.3" marker-end="url(#ag)"/>
</svg>
